<div class="card" style="width: 18rem;">
<img [src]="productoDemo.Imagen" class="card-img-top" alt="...">
<div class="card-body">
    <button class="button">
    <span class="button_lg">
    <h5 class="card-title">{{ productoDemo.referencia }}</h5>
    <p class="card-text">{{ productoDemo.Descripcion }}</p>

    <div class="size">
        <span>Tallas</span>
        <ul class="list-size">
            <li class="item-list"><button class="item-list-button">S</button></li>
            <li class="item-list"><button class="item-list-button">M</button></li>
            <li class="item-list"><button class="item-list-button">L</button></li>
            <li class="item-list"><button class="item-list-button">XL</button></li>
            <li class="item-list"><button class="item-list-button">XXL</button></li>
        </ul>
    </div>

    <!-- Agregar al carrito -->
    <button class="button" (click)="addToCart()">
        <span class="button_lg">
            <span class="button_sl"></span>
            <span class="button_text">Agregar al carrito</span>
        </span>
    </button>
        <button class="button">
    <span class="button_lg">
        <span class="button_sl"></span>
        <span class="button_text">Ver Más</span>
    </span>
    </button>

</div>
</div>
