<!-- cards de productos -->
<div class="d-flex flex-wrap gap-2 contenedor-cards">
@for (item of items; track $index) {
<div class="cards-container" style="width: 18rem;">
    <img
        class="card-img-top"
        [src]="item['Imagen'] || item['img']"
        [alt]="item['referencia'] || item['nombre'] || 'Producto'"
    >
    <div class="card-body">
        <h5 class="card-title">{{ item['referencia'] || item['nombre'] }}</h5>

    <button class="button" (click)="addToCart(item)">
        <span class="button_lg">
            <span class="button_sl"></span>
            <span class="button_text">Agregar al carrito</span>
        </span>
    </button>
    <button [routerLink]="['/visualizaciones',item._id]" class="button">
        <span class="button_lg">
            <span class="button_sl"></span>
            <span  class="button_text">Ver más</span>
        </span>
    </button>
    </div>
</div>
}
</div>
