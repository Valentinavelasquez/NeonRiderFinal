<!-- imagen -->
<div id="carouselExampleSlidesOnly" class="carousel slide" data-bs-ride="carousel">
    <div class="carousel-inner">
        <div class="carousel-item active">
            <img src="{{items.Imagen}}" class="d-block w-32">
        </div>
    </div>
</div>
<!-- accesorios adicionales -->
<table class="adicionales">
    <tr>
        <td data-label="Propiedad">Selecciona la talla</td>
        <ul class="list-size">
            <li class="item-list"><button class="item-list-button">S</button></li>
            <li class="item-list"><button class="item-list-button">M</button></li>
            <li class="item-list"><button class="item-list-button">L</button></li>
            <li class="item-list"><button class="item-list-button">XL</button></li>
            <li class="item-list"><button class="item-list-button">XXL</button></li>
        </ul>
    </tr>
    <tr>
        <td data-label="Propiedad">Color del grafico</td>
        <td data-label="Especificación">{{items.Color}}</td>
    </tr>
    <tr>
        <td data-label="Propiedad">Acabado</td>
        <td data-label="Especificación">Mate</td>
    </tr>
    <tr>
        <td data-label="Propiedad">Color Visor</td>

    </tr>
    <tr>
