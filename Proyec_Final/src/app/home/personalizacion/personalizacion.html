<div class="personalizador">
  <!-- Panel izquierdo: 2D -->
  <section class="panel-izq">
    <div class="face-tabs">
      <button [class.activo]="selectedFace==='front'" (click)="selectFace('front')">Frontal</button>
      <button [class.activo]="selectedFace==='left'"  (click)="selectFace('left')">Izquierda</button>
      <button [class.activo]="selectedFace==='right'" (click)="selectFace('right')">Derecha</button>
      <button [class.activo]="selectedFace==='back'"  (click)="selectFace('back')">Trasera</button>
      <button [class.activo]="selectedFace==='top'"   (click)="selectFace('top')">Superior</button>
    </div>

    <canvas #canvas2d class="mask-canvas" width="480" height="480"></canvas>

    <div class="grupo">
      <label>Imagen: </label>
      <input type="file" accept="image/*" (change)="pickImage($event)" />
      <button class="btn" (click)="clearImage()">Quitar imagen</button>
    </div>

    <div class="grupo">
      <label>Patrones:</label>
      <div class="row">
        <button class="btn" (click)="applyPattern('stripes')">Rayas</button>
        <button class="btn" (click)="applyPattern('stars')">Estrellas</button>
        <button class="btn" (click)="removePattern()">Sin patrón</button>
      </div>
    </div>

    <div class="grupo">
      <label>Texto</label>
      <input class="text-input" type="text" placeholder="Tu texto" (input)="onTextChange($event)" />
      <input type="color" value="#ffffff" (input)="onColorChange($event)" />
      <button class="btn" (click)="addText()">Añadir texto</button>
      <button class="btn danger" (click)="clearFace()">Limpiar esta área</button>
    </div>

    <div class="tips">Arrastra para rotar · Rueda para zoom · OrbitControls</div>
  </section>

  <!-- Panel derecho: visor 3D -->
  <section class="panel-der">
    <div #viewer3d class="viewer3d"></div>
  </section>
</div>
