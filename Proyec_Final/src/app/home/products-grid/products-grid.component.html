<ion-content fullscreen class="bg-dark">
  <!-- Carrusel solo en el dashboard -->
  <app-carrusel></app-carrusel>

  <ion-grid fixed>
    <ion-row>
      <ion-col size="12" sizeMd="6" sizeLg="4" sizeXl="3" *ngFor="let p of products">
        <ion-card class="product-card">
          <img class="product-img" [src]="'assets/img/' + p.image" [alt]="p.name">
          <ion-card-header>
            <ion-card-title>{{ p.name }}</ion-card-title>
          </ion-card-header>
          <ion-card-content>
            <div class="price">{{ p.price | currency:'COP':'symbol':'1.0-0' }}</div>
            <ion-button expand="block" (click)="addToCart(p)">
              AGREGAR AL CARRITO
            </ion-button>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>

  <!-- Modal declarativo con ng-template -->
  <ion-modal
    [isOpen]="cartOpen"
    (didDismiss)="closeCart()"
    [breakpoints]="[0, 0.45, 0.9]"
    [initialBreakpoint]="0.45"
    handle="true"
    cssClass="cart-modal">
    <ng-template>
      <app-cart-modal (closeRequest)="closeCart()"></app-cart-modal>
    </ng-template>
  </ion-modal>

  <!-- FAB carrito -->
  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="openCart()">
      <ion-icon name="cart"></ion-icon>
      <span class="badge" *ngIf="(count$ | async) as c">{{ c }}</span>
    </ion-fab-button>
  </ion-fab>
</ion-content>
