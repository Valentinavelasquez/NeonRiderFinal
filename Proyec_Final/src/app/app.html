<ion-app>
  <ion-menu side="end" menuId="carritoMenu" contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Mi carrito</ion-title>
      </ion-toolbar>
    </ion-header>
    <ion-content>
      <p>Aquí irá el contenido del carrito</p>
    </ion-content>
  </ion-menu>

  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Mi App</ion-title>
      <ion-buttons slot="end">
        <!-- usa el modal de Angular -->
        <ion-button (click)="abrirModalCarrito()">🛒 Carrito</ion-button>

        <!-- si quieres mantener también el menu de Ionic:
        <ion-button (click)="abrirCarrito()">Abrir sidebar</ion-button>
        -->
      </ion-buttons>
    </ion-toolbar>
  </ion-header>

  <ion-router-outlet id="main-content"></ion-router-outlet>

  <!-- Modal global -->
  <app-cart-modal></app-cart-modal>
</ion-app>
