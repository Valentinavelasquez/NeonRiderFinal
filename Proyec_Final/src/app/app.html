<ion-app>
  <ion-header>
    <ion-toolbar color="primary">
      <ion-title>Mi App</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- Contenido enrutado -->
  <ion-router-outlet id="main-content"></ion-router-outlet>

  <!-- Botón flotante del carrito -->
  <button class="cart-fab" (click)="abrirModalCarrito()" aria-label="Abrir carrito">
    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
      <path fill="currentColor"
        d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zm10
           0c-1.1 0-1.99.9-1.99 2S15.9 22 17 22s2-.9 2-2-.9-2-2-2zM7.16
           14.26l.03.01L19 14c.78 0 1.45-.55 1.63-1.3l1.72-7.45A1 1 0 0 0
           21.4 4H6.21l-.2-1.01A1.99 1.99 0 0 0 4.05 1H2v2h2l3.6 7.59-1.35
           2.45C5.52 14.37 6.17 15 7 15h12v-2H7.42l.74-1.34z"/>
    </svg>
    <span class="badge" *ngIf="cart.count > 0">{{ cart.count }}</span>
  </button>

  <!-- Modal del carrito (drawer derecho) -->
  <app-cart-modal></app-cart-modal>
</ion-app>
