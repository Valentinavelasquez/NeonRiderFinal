<img class="w-100" src="Fondo/logo_final.png" alt="">

<form [formGroup]="formUser" class="form">
    <p class="title">Registrarse </p>
    <p class="message">Regístrese ahora y acceda a todos nuestros beneficios</p>
      <div class="formulario">
          <label><input formControlName="nombre" required="" type="text" class="input"><span>Nombre</span></label>
          <label><input formControlName="apellido" required="" type="text" class="input"><span>Apellido</span></label>
          <label><input formControlName="correo" required="" type="email" class="input"><span>Correo</span></label>
          <label><input formControlName="password" required="" type="password" class="input"><span>Contraseña</span></label>
          <label><input formControlName="confirmPassword" required="" type="password" class="input"><span>Confirmar contraseña</span></label>
      </div>
      <div class="d-flex justify-content-center">
          <button class="button-submit" (click)="registrarse()">Enviar</button>
      </div>
    <p class="p">¿Ya tienes una cuenta?<a class="span register" routerLink="/loguin">Iniciar sesión</a> </p>
</form>
