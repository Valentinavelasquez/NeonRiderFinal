<img class="w-100" src="Fondo/logo_final.png" alt="">

<form [formGroup]="formLogin" class="form d-flex flex-wrap gap-1 ">
    <div class="title">Inicia sesión</div>
    <div class="flex-column">
      <label>Email </label>
      </div>
      <div class="inputForm">
        <input formControlName="correo" type="text" class="input" placeholder="Ingrese su email">
      </div>

    <div class="flex-column">
      <label>Contraseña </label></div>
      <div class="inputForm">

        <input formControlName="password" type="password" class="input" placeholder="Ingrese su contraseña">
      </div>

    <div class="">
      <span class="span forgot">¿Olvidó su contraseña?</span>
    </div>
    <button class="button-submit" (click)="loggeo()">Iniciar sesión</button>
    <p class="p">¿No tieness una cuenta? <span class="span register" routerLink="/registro">Registrarse</span>
    </form>
