            <p class="text">Documents</p>
          </button>
<!-- OPCIONES -->
          <div>
          <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
          <option selected>ELIGE LA MARCA</option>
          <option value="1">SHAFT</option>
          <option value="2">LS2</option>
          <option value="3">NOLAN</option>
          <option value="4">NEXX</option>
          <option value="5">ICH</option>
          <option value="6">AGV</option>
          </select>
          </div>
        <div class="form-group">
          <label for="textarea">DESCRIPCION</label>
          <textarea name="descripcion" id="textarea" rows="3" cols="1500" required="true">          </textarea>
        </div>
      <label for="textarea">TALLAS</label>
      <div>
        <input id="check-1" type="checkbox" />
        <label for="check-1">XS</label>
      </div>
      <div>
        <input checked="" id="check-2" type="checkbox" />
        <label for="check-2">S</label>
      </div>
      <div>
        <input id="check-3" type="checkbox" />
        <label for="check-3">M</label>
      </div>
      <div>
        <input id="check-4" type="checkbox" />
        <label for="check-4">L</label>
      </div>
            <div>
        <input id="check-5" type="checkbox" />
        <label for="check-5">XL</label>
      </div>

          <div>
          <select class="form-select" id="floatingSelect" aria-label="Floating label select example">
          <option selected>ELIGE EL MODELO</option>
          <option value="1">MODULAR</option>
          <option value="2">INTEGRAL</option>
          <option value="3">ABATIBLE</option>
          <option value="3">ABIERTO</option>
          <option value="3">MULTIPROPOSITO</option>
          <option value="3">CROSS</option>
          </select>
          </div>
            <label for="textarea">COLORES DISPONIBLES</label>
      <div>
        <input id="check-1" type="checkbox" />
        <label for="check-1">Negro</label>
      </div>
      <div>
        <input checked="" id="check-2" type="checkbox" />
        <label for="check-2">Azul</label>
      </div>
      <div>
        <input id="check-3" type="checkbox" />
        <label for="check-3">Morado</label>
      </div>
      <div>
        <input id="check-4" type="checkbox" />
        <label for="check-4">Gris</label>
      </div>
            <div>
        <input id="check-5" type="checkbox" />
        <label for="check-5">Multicolor</label>
      </div>
    <button class="form-submit-btn" type="submit">CREAR</button>
    <button class="form-submit-btn" type="submit">EDITAR</button>
    <button class="form-submit-btn" type="submit">ELIMINAR</button>

</form>
