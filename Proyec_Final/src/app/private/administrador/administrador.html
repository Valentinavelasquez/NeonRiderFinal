<div class="principalBox d-flex">
    <div class="boxOne">
        <!-- CREACION DE PRODUCTO CASCO -->
        <!-- Button trigger modal -->
        <div class="x"></div>
        <div class="d-flex justify-content-center">
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#exampleModal">
            Crear Producto
        </button>

        </div>

        <!-- Modal -->
        <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="exampleModalLabel">Modal title</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                    <div class="form-container">
                <div [formGroup]="formProduct" class="form">
                    <div class="form-group">
                    <label for="referencia">Referencia</label>
                    <input formControlName="referencia" type="text" id="referencias" name="referencia" required="true">

                    <label for="referencia">Imagen</label>
                    <input formControlName="Imagen" type="text" id="Imagen" name="Imagen" required="true">

                    <label for="referencia">Precio</label>
                    <input formControlName="Precio" type="text" id="precio" name="Precio" required="true">
                    </div>
                    <!-- Cargar imagen -->

            <!-- OPCIONES -->
                    <div>
                        <label for="floatingSelect1">Marca</label>
                    <select formControlName="Marca" class="form-select" id="floatingSelect1" aria-label="Floating label select example">
                    <option selected>ELIGE LA MARCA</option>
                    <option value="SHAFT">SHAFT</option>
                    <option value="LS2">LS2</option>
                    <option value="NOLAN">NOLAN</option>
                    <option value="NEXX">NEXX</option>
                    <option value="ICH">ICH</option>
                    <option value="AGV">AGV</option>
                    </select>
                    </div>
                    <div class="form-group">
                    <label for="textarea">DESCRIPCION</label>
                    <textarea formControlName="Descripcion" name="descripcion" id="textarea" rows="3" cols="1500" required="true">          </textarea>
                    </div>
                <label for="textarea">TALLAS</label>
                <div>
                    <input id="check-1" type="checkbox" />
                    <label for="check-1">XS</label>
                </div>
                <div>
                    <input checked="" id="check-2" type="checkbox" />
                    <label for="check-2">S</label>
                </div>
                <div>
                    <input id="check-3" type="checkbox" />
                    <label for="check-3">M</label>
                </div>
                <div>
                    <input id="check-4" type="checkbox" />
                    <label for="check-4">L</label>
                </div>
                        <div>
                    <input id="check-5" type="checkbox" />
                    <label for="check-5">XL</label>
                </div>

                    <div>
                        <label for="floatingSelect">Tipo</label>
                    <select formControlName="Tipo" class="form-select" id="floatingSelect" aria-label="Floating label select example">
                    <option selected>ELIGE EL TIPO</option>
                    <option value="modular">MODULAR</option>
                    <option value="integrales">INTEGRAL</option>
                    <option value="abatibles">ABATIBLE</option>
                    <option value="abiertos">ABIERTO</option>
                    <option value="multipropositos">MULTIPROPOSITO</option>
                    <option value="cross">CROSS</option>
                    </select>
                    </div>
                        <label for="textarea">COLORES DISPONIBLES</label>
                    <div>
                        <label for="floatingSelectColor">Color</label>
                        <select formControlName="Color" class="form-select" id="floatingSelectColor" aria-label="Floating label select example">
                            <option selected>ELIGE EL COLOR</option>
                            <option value="Negro">Negro</option>
                            <option value="Azul">Azul</option>
                            <option value="Morado">Morado</option>
                            <option value="Gris">Gris</option>
                            <option value="Multicolor">Multicolor</option>
                        </select>
                        </div>
                </div>
            </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                <button (click)="createProduct()" type="button" class="btn btn-primary">Crear Producto</button>
            </div>
            </div>
        </div>
        </div>

        <div class="d-flex justify-content-center">
            <h2 class="fs-1 fw-bold">Productos</h2>
        </div>

        <div class=""></div>
        @for (item of items; track $index) {
            <div class="product-card">
            <img src="{{item.Imagen}}" alt="Nombre del producto" class="product-img">
            <div class="product-info d-flex justify-content-between">
                <div class="d-flex">
                <h3 class="product-name fw-bold fs-2">{{item.referencia}}</h3>

                </div>
                <div class="product-actions">
                <button class="btn-action edit" title="Editar">
                    ✏️ Editar
                </button>
                <button (click)="deleteProduct(item._id)" class="btn-action delete" title="Eliminar">
                    🗑️ Eliminar
                </button>
                </div>
            </div>
            </div>

        }
    </div>
